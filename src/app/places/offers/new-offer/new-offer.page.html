<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/places/offers"></ion-back-button>
    </ion-buttons>
    <ion-title>New Offer</ion-title>
    <ion-buttons slot="primary">
      <ion-button 
      [disabled]="!form.valid"
      (click)="onCreateOffer()">
        <ion-icon name="checkmark" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content >
  <form [formGroup]="form">
<ion-grid>
  <ion-row>
    <ion-col size-sm="6" offset-sm="3">
    <ion-item>
      <ion-label position="floating">Title</ion-label>
      <ion-input type="text" autocomplete autocorrect formControlName="title"></ion-input>
    </ion-item>
    </ion-col>
  </ion-row>


  <ion-row>
    <ion-col size-sm="6" offset-sm="3">
    <ion-item>
      <ion-label position="floating">Short Description</ion-label>
      <ion-textarea rows="3" type="text" autocomplete autocorrect formControlName="description"></ion-textarea>
    </ion-item>
    </ion-col>
  </ion-row>

  <ion-row *ngIf="!form.get('description').valid && form.get('description').touched">
    <ion-col size-sm="6" offset-sm="3">
   <p style="margin-left:2% ;">Description must  be between 1 to 180 char</p>
    </ion-col>
  </ion-row>


  <ion-row>
    <ion-col size-sm="6" offset-sm="3">
    <ion-item>
      <ion-label position="floating">Price</ion-label>
      <ion-input type="number" formControlName="price"></ion-input>
    </ion-item>
    </ion-col>
  </ion-row>
<ion-row>
  <ion-col style="text-align: center;" size-sm="3" offset-sm="2">
    <div class="date-field">
      <ion-label>Available From</ion-label>

      <ion-datetime-button style="margin-top: 15px;" datetime="datetimeFrom"></ion-datetime-button>

      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime
            id="datetimeFrom"
            presentation="date"
            min="2026-01-01"
            max="2027-12-31"
            formControlName="availableFrom"
            required>
          </ion-datetime>
        </ng-template>
      </ion-modal>
    </div>
  </ion-col>

  <ion-col style="text-align: center;" size-sm="3" offset-sm="1">
    <div class="date-field">
      <ion-label>Available To</ion-label>

      <ion-datetime-button style="margin-top: 15px;" datetime="datetimeTo"></ion-datetime-button>

      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime
            id="datetimeTo"
            presentation="date"
            min="2026-01-01"
            max="2027-12-31"
            formControlName="availableTo"
            required>
          </ion-datetime>
        </ng-template>
      </ion-modal>
    </div>
  </ion-col>
</ion-row>
<ion-row >
  <ion-col size-sm="6" offset-sm="3">
    <ion-button type="submit"
      expand="block"
      [disabled]="!form.valid">
      Create Offer
    </ion-button>
  </ion-col>
</ion-row>
</ion-grid>

</form>
</ion-content>
