<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Your Bookings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content padding  >

<ion-grid>
  <ion-row>
    <ion-col size="12" size-md="6"  offset-md="3">
      <ion-list>
        <ion-item-sliding *ngFor="let booking of loadedBookings" #slidingItem>
          <ion-item>
            <ion-label>
              <h5>{{ booking.placeTitle }}</h5>
              <p>Guests : {{booking.placeId}}</p>

            </ion-label>
          </ion-item>
          <ion-item-options side="end">
            <ion-item-option color="danger" (click)="cancelBooking(booking.id, slidingItem)">
              <ion-icon slot="icon-only" name="trash"></ion-icon>
              Cancel
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      </ion-list>
    </ion-col>
  </ion-row>
</ion-grid>

</ion-content>
